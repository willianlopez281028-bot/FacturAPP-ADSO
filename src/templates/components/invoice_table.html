<div class="table-responsive"><table class="table app-table align-middle mb-0"><thead><tr><th>FACTURA</th><th>CLIENTE</th><th>FECHA</th><th>TOTAL</th><th>ESTADO</th></tr></thead><tbody>{% for invoice in invoices %}<tr><td><strong>{{ invoice.invoice_number }}</strong></td><td>{{ invoice.customer }}</td><td>{{ invoice.issued_at }}</td><td class="fw-semibold">{{ invoice.total|cop }}</td><td><span class="status-badge status-{{ invoice.status|lower }}">{{ invoice.status|replace('_',' ')|title }}</span></td></tr>{% else %}<tr><td colspan="5" class="empty-state">No hay facturas para mostrar.</td></tr>{% endfor %}</tbody></table></div>
